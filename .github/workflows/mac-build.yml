name: Build TEMP for macOS

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local Mac repair script
        shell: bash
        run: bash -n scripts/Repair-TEMP-Local.command
      - name: Build and verify native macOS executable
        shell: bash
        run: |
          set -euo pipefail
          DERIVED_DATA="$RUNNER_TEMP/TEMP-DerivedData"
          xcodebuild -project TEMP.xcodeproj -scheme TEMP -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" CODE_SIGNING_ALLOWED=NO build

          APP="$DERIVED_DATA/Build/Products/Debug/TEMP.app"
          PLIST="$APP/Contents/Info.plist"
          BIN="$APP/Contents/MacOS/TEMP"

          test -f "$PLIST" || { echo "::error::TEMP Info.plist is missing"; exit 1; }
          test -x "$BIN" || { echo "::error::TEMP executable is missing"; exit 1; }
          AGENT="$APP/Contents/Library/LaunchAgents/com.k1ngkat.temp.cleanup.plist"
          test -f "$AGENT" || { echo "::error::Embedded background agent plist is missing"; exit 1; }
          /usr/bin/plutil -lint "$AGENT"
          AGENT_PROGRAM=$(/usr/libexec/PlistBuddy -c 'Print :BundleProgram' "$AGENT")
          test "$AGENT_PROGRAM" = "Contents/MacOS/TEMP" || {
            echo "::error::The background agent does not point to TEMP's signed executable"
            exit 1
          }
          echo "✅ Embedded headless background cleanup agent present."

          ACTUAL_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")
          test "$ACTUAL_NAME" = "TEMP" || {
            echo "::error::CFBundleExecutable is '$ACTUAL_NAME', expected TEMP"
            exit 1
          }
          /usr/bin/file "$BIN" | grep 'Mach-O'

          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          test -n "$VERSION" && test -n "$BUILD"
          echo "✅ TEMP v$VERSION (build $BUILD) compiled and contains a launchable native executable."
          echo "## TEMP v$VERSION · Build $BUILD" >> "$GITHUB_STEP_SUMMARY"
          echo "Native macOS executable verified for commit \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"
