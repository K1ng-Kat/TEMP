name: Build TEMP for macOS

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify native macOS executable
        shell: bash
        run: |
          set -euo pipefail
          DERIVED_DATA="$RUNNER_TEMP/TEMP-DerivedData"
          xcodebuild -project TEMP.xcodeproj -scheme TEMP -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" CODE_SIGNING_ALLOWED=NO build

          APP="$DERIVED_DATA/Build/Products/Debug/TEMP.app"
          PLIST="$APP/Contents/Info.plist"
          BIN="$APP/Contents/MacOS/TEMP"

          test -f "$PLIST" || { echo "::error::TEMP Info.plist is missing"; exit 1; }
          test -x "$BIN" || { echo "::error::TEMP executable is missing"; exit 1; }

          ACTUAL_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")
          test "$ACTUAL_NAME" = "TEMP" || {
            echo "::error::CFBundleExecutable is '$ACTUAL_NAME', expected TEMP"
            exit 1
          }
          /usr/bin/file "$BIN" | grep 'Mach-O'
          echo "✅ TEMP.app contains a launchable native executable."
